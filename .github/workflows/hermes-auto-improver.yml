name: Hermes Auto-Improver

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Skills dir must be populated before running health check
  # Skills are in .hermes/skills/ directory within this repo
  HERMES_SKILLS_DIR: ${{ github.workspace }}/.hermes/skills
  HERMES_METRICS_FILE: ${{ github.workspace }}/health_metrics.json
  HERMES_MEMORY_FILE: ${{ github.workspace }}/.hermes/memory/memory.json
  HERMES_LESSONS_FILE: ${{ github.workspace }}/references/learned_lessons.jsonl

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Debug - Verify workspace
        run: |
          echo "=== WORKSPACE ==="
          pwd
          ls -la
          echo "=== SCRIPTS ==="
          ls -la scripts/
          echo "=== SKILL.MD ==="
          head -20 SKILL.md
          echo "=== SKILLS COUNT ==="
          find .hermes/skills -name "SKILL.md" | wc -l
      
      - name: Run Health Check
        run: python scripts/run_health_check.py
        continue-on-error: true
      
      - name: Debug - Show metrics
        if: always()
        run: |
          echo "=== METRICS ==="
          cat health_metrics.json | python -m json.tool || echo "No metrics file"
      
      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: health-metrics
          path: health_metrics.json
      
      - name: Check for Degraded Skills
        id: check
        run: python scripts/check_degraded.py >> $GITHUB_OUTPUT
      
      - name: Trigger Improvements
        if: steps.check.outputs.degraded != '0'
        run: |
          SKILLS=$(python scripts/get_degraded_skills.py)
          for skill in $SKILLS; do
            echo "=== IMPROVING: $skill ==="
            python scripts/improve_skill.py --skill "$skill" --skills-root "${{ env.HERMES_SKILLS_DIR }}"
          done
      
      - name: Debug - Show git diff
        if: steps.check.outputs.degraded != '0'
        run: |
          echo "=== GIT STATUS ==="
          git status
          echo "=== GIT DIFF ==="
          git diff
      
      - name: Sync Memory
        if: env.HERMES_TOKEN != ''
        run: python scripts/sync_memory.py
        env:
          HERMES_TOKEN: ${{ secrets.HERMES_TOKEN }}
      
      - name: Commit and Push Improvements
        if: steps.check.outputs.degraded != '0'
        run: |
          git add -A
          git commit -m "Auto-improve degraded skills" || echo "No changes to commit"
          git push origin HEAD:main
      
      - name: Create PR for Uncertain Changes
        if: steps.check.outputs.degraded != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-improve/${{ github.run_id }}
          title: "Auto-improve: degraded skills detected"
          body: |
            Health check found degraded skills.
            See workflow run for details.
          labels: auto-improve, needs-review
          commit-message: "Auto-improve degraded skills"
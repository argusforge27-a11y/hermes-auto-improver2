<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benchmark Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app" class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Skill Benchmark Review</h1>
      <p class="text-gray-600 mt-1" id="header-meta"></p>
    </header>

    <section class="mb-8 grid grid-cols-1 md:grid-cols-4 gap-4" id="summary-cards"></section>

    <section class="mb-8 p-4 bg-blue-50 rounded-lg border border-blue-200" id="delta-summary" style="display:none;">
      <h2 class="text-lg font-semibold text-blue-900 mb-2">Delta (Config 1 - Config 2)</h2>
      <div class="grid grid-cols-3 gap-4 text-sm" id="delta-values"></div>
    </section>

    <section id="eval-sections" class="space-y-6"></section>

    <section id="analyzer-notes" class="mt-8" style="display:none;">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">Analyzer Notes</h2>
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 space-y-2" id="notes-list"></div>
    </section>
  </div>

  <script>
    const BENCHMARK_DATA = __BENCHMARK_DATA__;

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toLocaleString();
    }

    function render() {
      if (!BENCHMARK_DATA) return;

      const metadata = BENCHMARK_DATA.metadata || {};
      const runSummary = BENCHMARK_DATA.run_summary || {};
      const runs = BENCHMARK_DATA.runs || [];

      document.getElementById('header-meta').textContent =
        `Model: ${metadata.executor_model || 'Unknown'} | Date: ${metadata.timestamp || 'Unknown'} | Skill: ${metadata.skill_name || 'Unknown'}`;

      const configs = Object.keys(runSummary).filter(k => k !== 'delta');
      const summaryCards = document.getElementById('summary-cards');
      summaryCards.innerHTML = configs.map(config => {
        const s = runSummary[config];
        const passRate = (s.pass_rate?.mean ?? 0) * 100;
        return `
          <div class="bg-white rounded-lg border border-gray-200 p-4 shadow-sm">
            <h3 class="font-semibold text-gray-900 mb-2">${config}</h3>
            <div class="space-y-2 text-sm">
              <div><span class="font-medium">Pass Rate:</span> ${passRate.toFixed(1)}% ± ${(s.pass_rate?.stddev ?? 0) * 100:.1f}%</div>
              <div><span class="font-medium">Avg Time:</span> ${(s.time_seconds?.mean ?? 0).toFixed(1)}s ± ${(s.time_seconds?.stddev ?? 0).toFixed(1)}s</div>
              <div><span class="font-medium">Avg Tokens:</span> ${formatNumber(s.tokens?.mean ?? 0)} ± ${formatNumber(s.tokens?.stddev ?? 0)}</div>
            </div>
          </div>
        `;
      }).join('');

      if (runSummary.delta) {
        const d = runSummary.delta;
        document.getElementById('delta-summary').style.display = 'block';
        document.getElementById('delta-values').innerHTML = `
          <div><span class="font-medium">Pass Rate:</span> ${d.pass_rate}</div>
          <div><span class="font-medium">Time:</span> ${d.time_seconds}s</div>
          <div><span class="font-medium">Tokens:</span> ${d.tokens}</div>
        `;
      }

      const runsByEval = {};
      for (const run of runs) {
        if (!runsByEval[run.eval_id]) runsByEval[run.eval_id] = [];
        runsByEval[run.eval_id].push(run);
      }

      const evalSections = document.getElementById('eval-sections');
      evalSections.innerHTML = Object.keys(runsByEval).sort((a, b) => a - b).map(evalId => {
        const evalRuns = runsByEval[evalId];
        return `
          <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
            <div class="bg-gray-100 px-4 py-3 border-b border-gray-200">
              <h2 class="font-semibold text-gray-900">Eval ${evalId}</h2>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-4 py-2 text-left text-sm font-medium text-gray-500 w-1/3">Expectation</th>
                    ${configs.map(c => `<th class="px-4 py-2 text-left text-sm font-medium text-gray-500">${c}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${configs.map(config => {
                    const configRuns = evalRuns.filter(r => r.configuration === config);
                    if (configRuns.length === 0) return '';
                    const run = configRuns[0];
                    return `
                      <tr class="border-b border-gray-100">
                        <td class="px-4 py-2 text-sm text-gray-900 font-medium">Run ${run.run_number}</td>
                        ${configs.map(c => {
                          const cr = evalRuns.find(r => r.configuration === c);
                          if (!cr) return '<td class="px-4 py-2 text-sm text-gray-400">—</td>';
                          const rate = (cr.result.pass_rate * 100).toFixed(0);
                          const color = rate === '100' ? 'text-green-600' : rate === '0' ? 'text-red-600' : 'text-amber-600';
                          return `<td class="px-4 py-2 text-sm ${color} font-medium">${rate}%</td>`;
                        }).join('')}
                      </tr>
                      ${run.expectations?.map(exp => `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                          <td class="px-4 py-2 text-sm text-gray-700">${exp.text}</td>
                          ${configs.map(c => {
                            const cr = evalRuns.find(r => r.configuration === c);
                            if (!cr) return '<td class="px-4 py-2"></td>';
                            const e = cr.expectations?.find(ex => ex.text === exp.text);
                            if (!e) return '<td class="px-4 py-2 text-gray-400">—</td>';
                            const passed = e.passed;
                            return `
                              <td class="px-4 py-2">
                                <span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium ${passed ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                                  ${passed ? '✓ Pass' : '✗ Fail'}
                                </span>
                                ${e.evidence ? `<div class="text-xs text-gray-500 mt-1 max-w-xs truncate" title="${e.evidence.replace(/"/g, '"')}">${e.evidence}</div>` : ''}
                              </td>
                            `;
                          }).join('')}
                        </tr>
                      `).join('') || ''}
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      if (BENCHMARK_DATA.notes && BENCHMARK_DATA.notes.length > 0) {
        document.getElementById('analyzer-notes').style.display = 'block';
        document.getElementById('notes-list').innerHTML = BENCHMARK_DATA.notes.map(note =>
          `<div class="text-sm text-amber-900">${note}</div>`
        ).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
</body>
</html>
